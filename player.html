<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAYER // NEXUS AUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="relative overflow-hidden">
    <div class="grid-bg fixed inset-0"></div>

    <div class="relative z-10 min-h-screen flex flex-col">
        <!-- Header -->
        <header class="border-b border-white border-opacity-20 p-6">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl tracking-widest glow-text">NEXUS AUDIO</h1>
                <nav class="flex gap-8 text-sm tracking-wider">
                    <a href="player.html"  class="glow-text">PLAYER</a>
                    <a href="library.html" class="opacity-60 hover:opacity-100">LIBRARY</a>
                    <a href="system.html"  class="opacity-60 hover:opacity-100">SYSTEM</a>
                </nav>
            </div>
        </header>

        <!-- Player Container -->
        <main class="flex-1 flex flex-col items-center justify-center py-12 px-4">
            <!-- Album Art -->
            <div class="album-art glow mb-10" id="album-art">
                <img src="" alt="Album Art" class="w-full h-full object-cover" id="album-img">
            </div>

            <!-- Track Info -->
            <div class="text-center mb-8 w-full max-w-md">
                <h2 class="text-xl tracking-widest glow-text mb-2 truncate" id="track-title">NO SIGNAL</h2>
                <p class="text-sm opacity-60 tracking-wide truncate" id="track-artist">---</p>
            </div>

            <!-- Progress Bar -->
            <div class="w-full max-w-md mb-2">
                <div class="progress-bar glow" id="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
                </div>
                <div class="flex justify-between text-xs mt-2 opacity-60">
                    <span id="current-time">00:00</span>
                    <span id="remaining-time">-00:00</span>
                </div>
            </div>

            <!-- Controls Row -->
            <div class="flex items-center gap-4 mt-6">
                <!-- Shuffle (NEW) -->
                <button class="control-btn relative" id="shuffle-btn" title="Shuffle" style="width:36px;height:36px">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm0.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>

                <!-- Prev -->
                <button class="control-btn" id="prev-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <!-- Play/Pause -->
                <button class="control-btn flex items-center justify-center glow" id="play-pause-btn" style="width:64px;height:64px">
                    <svg width="32" height="32" viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
                    <svg width="32" height="32" viewBox="0 0 24 24" id="pause-icon" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
                </button>

                <!-- Next -->
                <button class="control-btn" id="next-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>

                <!-- Repeat (NEW) -->
                <button class="control-btn relative" id="repeat-btn" title="Repeat" style="width:36px;height:36px">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    <span class="repeat-one-label glow-text">1</span>
                </button>
            </div>

            <!-- Volume Row (NEW) -->
            <div class="flex items-center gap-3 mt-6 opacity-70">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="shrink-0">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                </svg>
                <input type="range" min="0" max="100" value="100" class="volume-slider" id="volume-slider">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="shrink-0">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM16.5 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </div>
        </main>

        <!-- Visualizer Canvas -->
        <canvas id="visualizer-canvas"></canvas>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
